<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discover AI — Let's Talk to AI</title>
<style>
:root{--navy:#17345f;--teal:#187f80;--sage:#e5eee6;--cream:#faf7ef;--gold:#d8b46a;--text:#33424d;--white:#fff;--line:#d8dfda}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:Arial,sans-serif;line-height:1.55}
.wrap{max-width:900px;margin:auto;padding:0 20px}
header{background:linear-gradient(135deg,var(--sage),var(--cream));padding:34px 20px 28px;border-bottom:1px solid var(--line)}
.brand{font:700 28px Georgia,serif;color:var(--navy)}
.brand span{color:var(--teal)}
header p{margin:7px 0 0}
main{padding:28px 0 60px}
.panel{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(23,52,95,.07)}
.top{padding:24px 26px;border-bottom:1px solid var(--line)}
.top h1{font:700 32px Georgia,serif;color:var(--navy);margin:0 0 7px}
.top p{margin:0}
.chat{padding:24px;min-height:390px;max-height:560px;overflow-y:auto;background:#fff}
.msg{display:flex;margin:0 0 18px}
.msg.ai{justify-content:flex-start}
.msg.user{justify-content:flex-end}
.bubble{max-width:76%;padding:14px 17px;border-radius:18px;white-space:pre-wrap}
.ai .bubble{background:var(--sage);border-top-left-radius:5px}
.user .bubble{background:var(--teal);color:#fff;border-top-right-radius:5px}
.who{font-size:12px;font-weight:700;margin-bottom:4px;opacity:.8}
.controls{padding:18px 20px;border-top:1px solid var(--line);background:var(--cream)}
.choices{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:12px}
.choice{border:1px solid #9fb8b3;background:#fff;color:var(--navy);padding:10px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.choice:hover{background:var(--sage)}
.row{display:flex;gap:10px}
textarea{flex:1;resize:none;min-height:50px;border:1px solid #b8c8c2;border-radius:13px;padding:13px;font:inherit}
.send{border:0;border-radius:13px;background:var(--teal);color:#fff;font-weight:700;padding:0 20px;cursor:pointer}
.hint{margin-top:10px;border:0;background:none;color:var(--teal);font-weight:700;cursor:pointer}
.restart{display:none;margin:18px auto 0;border:0;background:var(--gold);color:var(--navy);font-weight:700;padding:12px 18px;border-radius:12px;cursor:pointer}
.progress{font-size:13px;color:#66737b;margin-top:9px}
@media(max-width:600px){.bubble{max-width:88%}.row{align-items:stretch}.send{padding:0 14px}.chat{min-height:430px}}

.hint-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.hint-card{background:#fff;border:1px solid #d8dfda;border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 3px 10px rgba(23,52,95,.06)}
.hint-art{width:100%;height:135px;display:block;background:#f6f3ea}
.hint-copy{padding:12px 13px 14px}
.hint-copy b{display:block;color:#17345f;margin-bottom:6px}
.hint-try{display:block;width:100%;margin-top:9px;padding:10px 12px;border:1px solid #c7d9d5;border-radius:10px;background:#fff;color:#17345f;font-size:14px;font-weight:600;text-align:left;cursor:pointer}
.hint-try:hover{border-color:#187f80;background:#f5fbfa}
.hint-note{margin:15px 0 0;color:#66737b;font-size:14px}
.example-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
.example-card{border:1px solid #d8dfda;border-radius:15px;background:#fbfaf6;padding:15px;text-align:left}
.example-card .icon{font-size:28px;margin-bottom:7px}
.example-card b{display:block;color:#17345f;margin-bottom:4px}
.example-card p{margin:0;font-size:14px}
@media(max-width:650px){.hint-grid,.example-grid{grid-template-columns:1fr}}

</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">Discover<span>AI</span></div>
    <p>See what AI can do for you.</p>
  </div>
</header>

<main>
<div class="wrap">
<section class="panel">
  <div class="top">
    <h1>Let's Talk to AI</h1>
    <p>You don't need the perfect words. Just tell AI what you want, and we'll work it out together.</p>
    <div class="progress" id="progress">Start by choosing something you'd like help with.</div>
  </div>

  <div class="chat" id="chat"></div>

  <div class="controls">
    <div class="choices" id="choices"></div>
    <div class="row">
      <textarea id="input" placeholder="Type what you're thinking..." aria-label="Your message"></textarea>
      <button class="send" id="send">Send</button>
    </div>
    <button class="hint" id="hint">💡 Give me an example</button>
    <button class="restart" id="restart">Start a new conversation</button>
  </div>
</section>
</div>
</main>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");
const choices=document.getElementById("choices");
const hint=document.getElementById("hint");
const restart=document.getElementById("restart");
const progress=document.getElementById("progress");

let state={
  stage:"start", category:"", topic:"", goal:"", location:"", interest:"", budget:"", dates:"", time:"",
  mealCount:0, dinnerIngredients:[], dinnerPreferences:[], details:[], turns:0
};

function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function addMessage(who,text){const wrap=document.createElement("div");wrap.className="msg "+(who==="AI"?"ai":"user");wrap.innerHTML='<div class="bubble"><div class="who">'+who+'</div>'+escapeHtml(text)+'</div>';chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;}
function say(t){addMessage("AI",t)}
function user(t){addMessage("You",t)}
function setProgress(t){progress.textContent=t}
function setStage(s){state.stage=s}
function clearChoices(){choices.innerHTML=""}
function setChoices(items){choices.innerHTML="";items.forEach(item=>{const b=document.createElement("button");b.className="choice";b.textContent=item;b.onclick=()=>handle(item,true);choices.appendChild(b)})}
function finish(){setProgress("Conversation complete — notice how you steered AI.");restart.style.display="block";setChoices(["Try another example"])}
function restartNow(){start()}

function isUncertain(t){return /(?:don['’]?t|do not|dont)\s+know|not sure|i['’]?m not sure|you pick|pick for me|choose for me|you choose|surprise me|whatever works|anything is fine/i.test(String(t).trim())}
const CORRECTION=/\b(?:actually|instead|wait|no,|no i mean|i meant|i mean|never mind|change of plans)\b/i;
function cleanText(t){return t.trim().replace(/^(?:actually|instead|wait|no,|no i mean|i meant|i mean|never mind|change of plans)\s*/i,"").trim()}
function directIntent(t){
  if(/grocery|groceries|grocery shopping|shopping list/i.test(t)) return "groceries";
  if(/organize my week|organise my week|plan my week|get .*week.*organiz|week.*organized|week.*organised/i.test(t)) return "week";
  if(/places to eat|find .*restaurant|restaurant|where .*eat|good place to eat|find .*place.*eat|somewhere to eat|food near/i.test(t)) return "restaurants";
  if(/find things to do|things to do|activities|places to visit|what to do there/i.test(t)) return "things";
  if(/make (?:a )?cake|bake a cake|birthday cake/i.test(t)) return "cake";
  if(/birthday card|write (?:a )?(?:card|letter)|create (?:a )?(?:card|story)|write a story/i.test(t)) return "createTask";
  if(/solve a problem|fix (?:this|it|something)|help me (?:solve|fix)|problem to solve/i.test(t)) return "problem";
  if(/teach me .*step by step|step by step|show me how/i.test(t)) return "learnSteps";
  if(/explain .*simple|explain .*simply|simple terms/i.test(t)) return "learnSimple";
  if(/what can i use ai for|what can ai do for me|i don['’]?t know what i can use ai for|not sure what ai can do/i.test(t)) return "exploreAI";
  return "";
}
function categoryOf(t){
  if(/travel|trip|vacation|hotel|flight|destination|restaurant|eat|food|things to do|activities/i.test(t)) return "travel";
  if(/learn|study|understand|research|teach|explain|practice|quiz/i.test(t)) return "learn";
  if(/create|write|writing|idea|project|card|story|cake|bake|birthday/i.test(t)) return "create";
  if(/problem|solve|fix|bill|cost|lower|reduce|save money|confusing|not working/i.test(t)) return "problem";
  if(/grocery|dinner|meal|week|schedule|organize|errand|shopping|home|house/i.test(t)) return "everyday";
  return "open";
}
function contextSwitch(t){
  const c=cleanText(t), intent=directIntent(c), cat=categoryOf(c);
  state.category=cat;state.topic="";state.goal="";state.location="";state.interest="";state.budget="";state.dates="";state.time="";state.details=[];
  if(intent==="groceries") return groceryStart(true);
  if(intent==="week") return weekStart(true);
  if(intent==="restaurants") return restaurantStart(true);
  if(intent==="things") return travelThingsStart(true);
  if(intent==="cake") return createCakeStart(c,true);
  if(intent==="createTask") return createStart(c,true);
  if(intent==="problem") return problemStart(c,true);
  if(intent==="learnSteps") return learnStart(c,"steps",true);
  if(intent==="learnSimple") return learnStart(c,"simple",true);
  if(cat==="travel") return travelStart(c,true);
  if(cat==="learn") return learnStart(c,"",true);
  if(cat==="create") return createStart(c,true);
  if(cat==="problem") return problemStart(c,true);
  if(cat==="everyday") return everydayStart(c,true);
  return openStart(c,true);
}
function shouldContextSwitch(t){
  const c=cleanText(t), intent=directIntent(c);
  if(CORRECTION.test(t) && (intent || categoryOf(c)!==state.category || /grocer|week|restaurant|things to do|cake|card|problem|learn|trip/i.test(c))) return true;
  if(state.stage!=="start" && intent){
    if(intent==="groceries" && state.topic!=="grocery shopping") return true;
    if(intent==="week" && state.topic!=="organizing your week") return true;
    if(intent==="restaurants" && state.topic!=="finding places to eat") return true;
    if(intent==="things" && state.topic!=="things to do") return true;
    if(intent==="cake" || intent==="createTask") return true;
    if(intent==="problem" && state.category!=="problem") return true;
    if((intent==="learnSteps"||intent==="learnSimple") && state.category!=="learn") return true;
    if(intent==="exploreAI") return true;
  }
  return false;
}
function handleMeta(text){
  if(/^(?:start over|start again|new conversation|let['’]?s start over)$/i.test(text)){start();return true}
  if(/^(?:can you slow down|slow down|that['’]?s too much|too much information|make it simpler|simpler|i['’]?m confused|i am confused)$/i.test(text)){
    if(state.stage==="start"||state.stage==="openExplore") say("Absolutely. We can slow down. We'll take one small step at a time. What would you like to work on?");
    else if(state.topic) say(`Sure. Let's keep it simple. We're working on ${state.topic}. Tell me the one thing you want help with next.`);
    else say("No problem. We'll take this one small step at a time. Tell me what you'd like help with next.");
    setChoices(["Tell me one step","Give me an example","Start over"]); return true
  }
  if(/^(?:go back|back)$/i.test(text)){
    if(state.category==="travel"&&state.stage!=="topic"){setStage("topic");say("Sure — let's go back a step. What travel idea do you want to work on?")}
    else if(state.category==="everyday"){setStage("everydayTopic");say("Sure — let's go back. What everyday thing would you like help with?")}
    else if(state.category==="create"){setStage("topic");say("Sure — let's go back. What would you like to create?")}
    else {say("Sure. Let's take a step back. What would you like to work on?")}
    return true
  }
  return false
}

function start(){chat.innerHTML="";state={stage:"start",category:"",topic:"",goal:"",location:"",interest:"",budget:"",dates:"",time:"",mealCount:0,dinnerIngredients:[],dinnerPreferences:[],details:[],turns:0};restart.style.display="none";clearChoices();say("That's a great place to start!\n\nWhat would you like help with?");setProgress("Choose a starting point, or type your own idea.");setChoices(["🌱 Everyday life","✈️ Travel","📚 Learn something","🎨 Create something","🔧 Help me solve a problem","💡 I'm not sure"]);updateCategoryExamples("open")}
start();

function everydayStart(topic,isSwitch=false){state.category="everyday";if(topic){state.topic=topic}updateCategoryExamples("everyday");
  if(/grocery|groceries|grocery shopping/i.test(topic||"")) return groceryStart(isSwitch);
  if(/week|organize|organise/i.test(topic||"")) return weekStart(isSwitch);
  if(/dinner|meal/i.test(topic||"")){state.topic="dinner";setStage("dinnerDetails");say("Sure! Let's work on dinner. What ingredients do you have, or what kind of meal sounds good?");setProgress("Step 2: Tell AI what would make dinner useful for you.");return}
  setStage("everydayTopic");say("Absolutely. Everyday things are a great place to use AI. What would you like help with?");setProgress("Step 1: Tell AI what you want help with.");setChoices(["Organize my week","Help with groceries","Plan dinner","Solve a problem"])}
function groceryStart(isSwitch=false){state.category="everyday";state.topic="grocery shopping";setStage("groceryDetails");updateCategoryExamples("everyday");say(isSwitch?"Of course! We can switch gears. Let's work on your grocery shopping instead.\n\nWhat would you like help with — making a grocery list, planning meals, comparing prices, or something else?":"Absolutely. Let's work on your grocery shopping.\n\nWhat would you like help with — making a grocery list, planning meals, comparing prices, or something else?");setProgress("Step 2: Tell AI what you want to do with your grocery shopping.")}
function weekStart(isSwitch=false){state.category="everyday";state.topic="organizing your week";setStage("weekDetails");updateCategoryExamples("everyday");say(isSwitch?"Of course. Let's focus on organizing your week instead.\n\nWhat do you have coming up that you'd like to fit into it?":"Absolutely. Let's organize your week.\n\nWhat do you have coming up that you'd like to fit into it?");setProgress("Step 2: Give AI the things you need to fit into your week.")}
function travelStart(topic,isSwitch=false){state.category="travel";state.topic=topic||"planning a trip";setStage("travelGoal");updateCategoryExamples("travel");say(isSwitch?`Sure — let's switch to ${state.topic}. What would you like AI to help you do with that?`:`Great. What would you like AI to help you do with ${state.topic}?`);setProgress("Step 2: Tell AI what you want to accomplish.");setChoices(["Make a plan","Find ideas","Compare options","I'm not sure yet"])}
function travelThingsStart(isSwitch=false){state.category="travel";state.topic="things to do";setStage("travelDetails");updateCategoryExamples("travel");say(`Sure! I can help you find things to do.\n\nWhere are you looking — a city, neighborhood, hotel, or another place?`);setProgress("Step 2: Give AI your location.")}
function restaurantStart(isSwitch=false){state.category="travel";state.topic="finding places to eat";setStage("restaurantGoal");updateCategoryExamples("travel");say(isSwitch?"Of course! Let's work on finding places to eat instead.\n\nWhat are you looking for?":"Absolutely. I can help you find places to eat.\n\nWhat are you looking for?");setProgress("Step 2: Tell AI what kind of food or restaurant you want.");setChoices(["Find ideas","Something inexpensive","A specific kind of food","Something near me"])}
function learnStart(topic,mode="",isSwitch=false){state.category="learn";state.topic=topic||"something new";updateCategoryExamples("learn");
  if(mode==="steps"){state.goal="learn step by step";setStage("learnResult");say(`Absolutely. Let's learn ${state.topic} together, one step at a time.\n\nWhat is the first thing you'd like to be able to do?`);setProgress("Step 3: Tell AI what you want to accomplish.");return}
  if(mode==="simple"){state.goal="simple explanation";setStage("learnResult");say(`Sure. I'll explain ${state.topic} in everyday language first. If anything is unclear, you can ask me to explain it another way.`);setProgress("Step 3: AI adapts to how you want to learn.");setChoices(["Give me an example","Teach me step by step","Make that simpler"]);return}
  setStage("learnGoal");say(isSwitch?`Sure. Let's switch to learning about ${state.topic}. What would make that useful to you?`:`Great. What would make learning about ${state.topic} useful to you?`);setProgress("Step 2: Tell AI how you want to learn.");setChoices(["Explain it simply","Give me an example","Teach me step by step","Help me practice","I'm not sure yet"])}
function createStart(topic,isSwitch=false){state.category="create";state.topic=topic;updateCategoryExamples("create");setStage("createGoal");say(isSwitch?`Sure — let's work on ${topic}. What would you like the finished result to help you do?`:`I like that. What would you like the finished result to help you do?`);setProgress("Step 2: Tell AI what the result should do.");setChoices(["Give me ideas","Help me make a plan","Help me write it","I'm not sure yet"])}
function createCakeStart(topic,isSwitch=false){state.category="create";state.topic="cake";updateCategoryExamples("create");setStage("createCakeDetails");say("Absolutely! Let's make a cake.\n\nWhat kind of cake sounds good — chocolate, vanilla, fruit, or something else?");setProgress("Step 2: Tell AI what kind of cake you want.");setChoices(["Chocolate","Vanilla","Fruit","You pick"])}
function problemStart(topic,isSwitch=false){state.category="problem";state.topic=topic||"a problem";updateCategoryExamples("problem");setStage("problemGoal");say(isSwitch?"Sure — let's work on that problem. What would you like to accomplish with it?":"That's a great place to start. What would you like to accomplish with this?");setProgress("Step 2: Tell AI what you want to change or accomplish.");setChoices(["Understand what's happening","Find a solution","Make a plan","I'm not sure yet"])}
function openStart(topic,isSwitch=false){state.category="open";state.topic=topic;updateCategoryExamples("open");
  if(/what can i use ai for|what can ai do for me|i don['’]?t know what i can use ai for|not sure what ai can do/i.test(topic)){setStage("openExplore");say("That's a great question. AI can help with everyday things like planning, shopping, travel, learning, writing, solving problems, and coming up with ideas.\n\nWhich sounds most useful right now?");setProgress("Step 2: Pick something that sounds useful — or tell AI your own idea.");setChoices(["Solve a problem","Plan something","Make something","Learn something","Help with everyday life"]);return}
  setStage("openGoal");say(`Okay — ${topic}.\n\nWhat would you like AI to help you do with that?`);setProgress("Step 2: Tell AI what you want to accomplish.")}

function handleStart(text){
  if(directIntent(text)==="exploreAI") return openStart("I don't know what I can use AI for");
  if(directIntent(text)==="groceries") return groceryStart();if(directIntent(text)==="week") return weekStart();if(directIntent(text)==="restaurants") return restaurantStart();if(directIntent(text)==="things") return travelThingsStart();if(directIntent(text)==="cake") return createCakeStart(text);if(directIntent(text)==="problem") return problemStart("a problem");if(directIntent(text)==="learnSteps") return learnStart(text,"steps");if(directIntent(text)==="learnSimple") return learnStart(text,"simple");
  if(/^🌱\s*Everyday life$/i.test(text)){return everydayStart()}
  if(/^✈️\s*Travel$/i.test(text)){state.category="travel";setStage("topic");updateCategoryExamples("travel");say("Great — let's use travel as our example. What are you thinking about?");setProgress("Step 1: Tell AI what you have in mind.");setChoices(["Plan a trip","Find places to eat","Find things to do"]);return}
  if(/^📚\s*Learn something$/i.test(text)){state.category="learn";setStage("topic");updateCategoryExamples("learn");say("Perfect. What would you like to learn or understand?");setProgress("Step 1: Tell AI what you're curious about.");return}
  if(/^🎨\s*Create something$/i.test(text)){state.category="create";setStage("topic");updateCategoryExamples("create");say("I like that. What would you like to create or work on?");setProgress("Step 1: Tell AI what you want to make.");return}
  if(/^🔧\s*Help me solve a problem$/i.test(text)){state.category="problem";setStage("problemTopic");updateCategoryExamples("problem");say("That's a great place to start. Tell me what's going on. It can be as simple as a few words.");setProgress("Step 1: Tell AI what's happening.");return}
  if(/^💡\s*I'm not sure$/i.test(text)){state.category="open";setStage("openExplore");updateCategoryExamples("open");say("That's completely okay. We can start anywhere. Are you curious about what AI can do, or do you already have something you want help with?");setProgress("Step 1: You don't need a perfect question.");setChoices(["Show me what AI can do","I have something in mind"]);return}
  const cat=categoryOf(text);if(cat==="travel")return travelStart(text);if(cat==="learn")return learnStart(text);if(cat==="create")return createStart(text);if(cat==="problem")return problemStart(text);if(cat==="everyday")return everydayStart(text);return openStart(text)
}

function handle(raw,fromChoice=false){const text=String(raw).trim();if(!text)return;clearChoices();user(text);state.turns++;
  if(handleMeta(text))return;
  if(state.stage!=="start" && shouldContextSwitch(text)){contextSwitch(text);return}
  if(state.stage==="start")return handleStart(text);

  if(state.stage==="openExplore"){
    if(/show me what ai can do/i.test(text)){say("Sure. For example, AI can help you plan a trip, organize your week, make a grocery list, learn something new, write a letter, brainstorm an idea, or work through a problem.\n\nWhich one sounds interesting?");setChoices(["Plan a trip","Organize my week","Make a grocery list","Learn something"]);return}
    if(/solve a problem/i.test(text))return problemStart("a problem");
    if(/plan something|plan a trip/i.test(text))return travelStart("planning a trip");
    if(/make something/i.test(text))return createStart("something");
    if(/learn something/i.test(text))return learnStart("something new");
    if(/everyday life|organize my week/i.test(text))return everydayStart();
    if(/i have something in mind/i.test(text)){setStage("openGoal");say("Perfect. Tell me what you're thinking about, even if it's only a few words.");return}
    say("That's okay. We can explore together. What sounds most useful?");setChoices(["Solve a problem","Plan something","Make something","Learn something"]);return
  }

  if(state.stage==="topic"){
    if(state.category==="travel"){if(directIntent(text)==="restaurants")return restaurantStart();if(directIntent(text)==="things")return travelThingsStart();state.topic=text;return travelStart(text)}
    if(state.category==="learn")return learnStart(text);
    if(state.category==="create"){if(/get ideas|give me ideas|brainstorm|some ideas/i.test(text)){state.topic="a creative project";state.goal="generate ideas";setStage("createResult");say("Absolutely. What would you like ideas for — a card or gift, a meal, a home project, something to write, or something else?");setProgress("Step 2: Tell AI what you'd like ideas for.");setChoices(["A card or gift","A meal or recipe","A home project","Something to write"]);return}return createStart(text)}
    if(state.category==="open")return openStart(text);return everydayStart(text)
  }
  if(state.stage==="everydayTopic"){
    if(directIntent(text)==="week")return weekStart();if(directIntent(text)==="groceries")return groceryStart();if(/dinner|meal/i.test(text)){state.topic="dinner";setStage("dinnerDetails");say("Sure! What ingredients do you have, or what kind of dinner sounds good?");return}return openStart(text)
  }
  if(state.stage==="problemTopic")return problemStart(text)

  if(state.stage==="weekDetails"){
    if(isUncertain(text)){say("That's okay. We can start with what you already mentioned. What is one thing you definitely need to do this week?");setChoices(["An appointment","An errand","Grocery shopping","Something else"]);return}
    state.details.push(text);setStage("weekResult");say("Got it. Let's build your week around that. You can add appointments, errands, family plans, shopping, or anything else that needs to happen.");setProgress("Step 3: Add another item, or ask AI to turn what you have into a simple plan.");setChoices(["Add another item","Make me a simple plan","Keep it simple"]);return
  }
  if(state.stage==="weekResult"){
    if(isUncertain(text)){say("No problem. We can work with what we have. I'll keep the list simple and you can add things as you remember them.");setChoices(["Make me a simple plan","Add another item"]);return}
    if(/another|add/i.test(text)){setStage("weekDetails");say("Sure. What's the next thing you need to fit into your week?");return}
    if(/plan/i.test(text)){say("Here's the simple approach: put the things that must happen on the right days, then leave some open time between them. You can ask AI to rearrange the plan when things change.");finish();return}
    if(/simple/i.test(text)){say("In simple terms: tell AI what you have going on this week, and ask it to help put everything in order.");finish();return}
    return weekDetails(text)
  }

  if(state.stage==="groceryDetails")return groceryDetails(text)
  if(state.stage==="groceryResult"){

function groceryDetails(text){state.details.push(text);const m=text.match(/\b(one|two|three|four|five|\d+)\s+(?:dinners?|meals?)\b/i);if(m){const w={one:1,two:2,three:3,four:4,five:5};state.mealCount=w[m[1].toLowerCase()]||parseInt(m[1],10)||0}
  if(/three dinners|two dinners|one dinner|four dinners|five dinners|\d+ dinners|three meals|two meals|one meal|four meals|five meals|\d+ meals/i.test(text)){state.goal=`plan ${state.mealCount||3} dinners`;setStage("groceryResult");say(`Absolutely. Let's plan ${state.mealCount||3} dinners. Do you have meals in mind, or would you like me to choose them?`);setChoices(["I have meals in mind","You pick","I don't know"]);return}
  if(/list|grocery list|shopping list/i.test(text)){setStage("groceryResult");say("Absolutely. Let's make a grocery list.\n\nTell me what meals you want to make, or tell me a few foods you already know you need.");return}
  if(/meal|dinner|breakfast|lunch/i.test(text)){say(`Great. Tell me what meals you want to plan, or tell me what you already have, and I'll build the list around it.`);return}
  say("Got it. Tell me whether you want a grocery list, meal ideas, or help planning the meals.");setChoices(["Make a grocery list","Plan some meals","You pick"])
}

function travelResult(text){
  const t=String(text).trim();
  const no=/^(?:no|no thanks|not now|none|nothing else|i don't want to|i do not want to)$/i.test(t);
  const looksLikeBudget=/^\$?\s*\d+(?:,\d{3})*(?:\.\d{1,2})?(?:\s*(?:dollars?|usd))?(?:\s*(?:per person|each|pp))?$/i.test(t);
  if(no){
    setStage("travelResult");
    say(`No problem. We'll work with what you already gave me: ${state.location}${state.interest?` and ${state.interest}`:""}. You can ask me to find ideas now, or add another detail later.`);
    setChoices(["Find ideas now","Add a budget","Add my dates","Add how much time I have"]);
    setProgress("Step 4: You can stop adding details whenever you have enough.");
    return
  }
  if(/budget|price|cost|inexpensive|cheap|affordable|spend/i.test(t)){
    setStage("travelBudget");
    say("Sure. About how much would you like to spend per person? A rough amount is fine.");
    return
  }
  if(looksLikeBudget){
    state.budget=t;
    setStage("travelBudgetResult");
    say(`Got it — I'll keep ${t} in mind as your budget. Is that your total budget or about that amount per person?`);
    setChoices(["Total budget","Per person","I'm not sure"]);
    setProgress("Step 4: AI understood your number as a budget and is checking what it means.");
    return
  }
  if(/date|when|day|weekend/i.test(t)){setStage("travelDates");say("Great. What dates are you considering?");return}
  if(/time|hour|how long/i.test(t)){setStage("travelTime");say("Good question. About how much time will you have there?");return}
  if(/find ideas|ideas|find options|find something/i.test(t)){say(`Great. AI now has a useful request for ${state.location} and ${state.interest}. In a real AI conversation, you could ask for a few options that fit those details.`);finish();return}
  say(`Absolutely. Tell me one more detail — your budget, dates, or how much time you have. You can also say "no, that's enough" if you want to move on.`);setChoices(["Add a budget","Add my dates","Add how much time I have","Find ideas now"])
}
function travelBudget(text){state.budget=text;setStage("travelBudgetResult");say(`Perfect. I'll keep that budget in mind: ${text}.\n\nSo far we have ${state.location}${state.interest?` and ${state.interest}`:""}. A useful next detail is your dates or how much time you'll have.`);setChoices(["Add my dates","Add how much time I have","Find ideas now"])}
function travelRefinement(text){
  const t=String(text).trim();
  if(/^(?:total|total budget|whole trip|all together)$/i.test(t)){setStage("travelRefinementDone");say(`Perfect. I'll treat ${state.budget} as your total budget for the trip.`);setChoices(["Find ideas now","Add my dates","Add how much time I have","Done"]);return}
  if(/^(?:per person|each|per traveler|per traveller|pp)$/i.test(t)){setStage("travelRefinementDone");say(`Got it. I'll treat ${state.budget} as your budget per person.`);setChoices(["Find ideas now","Add my dates","Add how much time I have","Done"]);return}
  if(/^(?:done|finished|finish|that's all|thats all|that is all|nothing else|no more)$/i.test(t)){setStage("travelRefinementDone");say(`Great. We have ${state.location}${state.interest?`, ${state.interest}`:""}${state.budget?`, budget ${state.budget}`:""}. That's enough to move forward.`);finish();return}
  if(isUncertain(t)){say(`That's okay. I'll keep the budget as ${state.budget} and we can keep going without deciding that detail yet.`);setChoices(["Find ideas now","Add my dates","Add how much time I have","Done"]);return}
  if(/budget|price|cost|inexpensive|cheap|affordable|spend/i.test(t)){return travelBudget("your budget")}
  if(/date|when|day|weekend/i.test(t)){setStage("travelDates");say("Great. What dates are you considering?");return}
  if(/time|hour|how long/i.test(t)){setStage("travelTime");say("About how much time will you have there?");return}
  if(/find ideas|ideas|find options|find something|show me/i.test(t)){const extras=[state.dates&&`dates ${state.dates}`,state.time&&`time ${state.time}`,state.budget&&`budget ${state.budget}`].filter(Boolean).join(", ");say(`Great. AI now has a useful request: ${state.location}, ${state.interest||"your interests"}${extras?", "+extras:""}. You can ask for a few options that fit those details.`);finish();return}
  say("That's useful. Add a budget, dates, time, or ask for ideas.");setChoices(["Add a budget","Add my dates","Find ideas now","Done"])}
function genericResult(text){say("That's useful. AI can keep working with that. Tell it one more detail, or ask it to make the answer simpler or more specific.");setChoices(["Make it simpler","Give me an example","Tell me the next step"])}

function updateCategoryExamples(category){const b=document.getElementById("categoryExamples");if(!b)return;const data={open:[["💡","Explore AI","See practical things AI can help you do."],["🧭","Start with a problem","Use AI to work through something you're dealing with."],["📅","Plan something","Trips, weeks, meals, errands, and more."],["📖","Learn something","Ask AI to explain or teach something step by step."]],travel:[["🗺️","Plan a trip","Build an itinerary, compare options, or organize travel."],["🍽️","Find places to eat","Find restaurants by location, food, budget, and preferences."],["📍","Find things nearby","Discover places, activities, or services near you."],["📅","Plan your day","Put sightseeing, meals, and activities into an easy schedule."]],everyday:[["📅","Organize","Get your week or errands into a manageable plan."],["🛒","Groceries","Build lists and plan meals around what you have."],["🍳","Dinner","Come up with meals and recipes from what you have."],["🔧","Solve a problem","Work through confusing bills, decisions, or everyday problems."]],learn:[["📖","Explain it simply","Ask AI to explain a topic in everyday language."],["🔎","Give an example","See a real-world example."],["👣","Teach me step by step","Learn one step at a time."],["🧠","Help me practice","Quiz yourself or practice together."]],create:[["💭","Get ideas","Brainstorm ideas for a project, card, meal, or activity."],["⭐","Choose an idea","Compare ideas and pick one."],["📝","Make a plan","Turn an idea into doable steps."],["✨","Improve it","Get suggestions to make an idea better."]],problem:[["🔧","Solve a problem","Break a confusing problem into smaller steps."],["💰","Save money","Look for ways to lower a cost or compare options."],["📝","Make a plan","Turn a problem into practical next steps."],["❓","Understand what's happening","Use AI to ask what may be causing something."]]};const key=data[category]?category:"open";b.innerHTML=data[key].map(x=>`<div class="example-card"><div class="icon">${x[0]}</div><b>${x[1]}</b><p>${x[2]}</p></div>`).join("")}

ree dinners."],["📅","Organize","Help me organize my week."],["🔧","Solve a problem","Help me figure out how to handle this."]],learn:[["📖","Explain it simply","Explain gardening in simple terms."],["🔎","Give an example","Give me an example of how that works."],["👣","Go step by step","Teach me how to do it step by step."],["🧠","Practice","Quiz me on what I just learned."]],create:[["💭","Get ideas","Give me some ideas for a birthday card."],["⭐","Choose an idea","Which idea would be easiest?"],["📝","Make a plan","Help me make a plan for it."],["✨","Improve it","How could I make this better?"]],problem:[["🔧","Solve a problem","Help me figure out how to lower a bill."],["💰","Save money","How can I save money on this?"],["📝","Make a plan","Help me make a plan to solve this."],["❓","Understand it","Help me understand what's happening."]],open:[["💡","Start anywhere","Give me some ideas of what you can help me with."],["❓","Ask for help","What could I ask you?"],["🧭","Find a direction","Help me figure out what would be useful."],["🌱","Begin simply","I don't know where to start."]]};let key=lists[state.category]?state.category:"open";gallery.innerHTML=lists[key].map(x=>`<div class="hint-card">${art[key]}<div class="hint-copy"><b>${x[0]} ${x[1]}</b><button class="hint-try" type="button">Try it → “${x[2]}”</button></div></div>`).join("");gallery.querySelectorAll(".hint-try").forEach((btn,i)=>btn.onclick=()=>{input.value=lists[key][i][2];input.focus()});chat.appendChild(gallery);chat.scrollTop=chat.scrollHeight}
